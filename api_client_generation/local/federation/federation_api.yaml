  /api/v2/customer/contacts:
    post:
      tags:
        - Contact
      summary: Add a contact and/or advisors to a contact (recommended)
      description: |
        Add a contact and/or advisor(s) to the contact.<br/>
        This end point can be called in 2 situations:<br/>
        <ol>
          <li>To create a contact and eventually immediately associate one or more advisors.</li>
          <li>To add more advisors to an existing contact.</li>
        </ol>
        In both cases, you must provide all the contact's mandatory fields listed as "body params".<br/>

        **Note** <br/>
        <ul>
        <!-- <li>to be checked A maximum of 25 advisorSymphonyId or advisorEmailAddress can be passed in on call.</li> -->
          <li>If both advisorSymphonyId and advisorEmailAddresses are passed, the advisorSymphonyId will prevail.</li>
        </ul>
      operationId: addContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/customer-contact-request"
      responses:
        "200":
          description: Contact added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/add-contact-response"
        "400":
          description: Missing or malformed input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_400_1"
        "403":
          description: Onboard user forbidden
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/inline_response_403"
                  - $ref: "#/components/schemas/inline_response_403_0"
                  - $ref: '#/components/schemas/user-id-mismatch'
                  - $ref: '#/components/schemas/phone-international-onboarding-forbidden'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_401"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tenant-configuration-not-found"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_409"
        "500":
          description: User creation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create-account-failed"
      security:
        - sfsAuthentication: []
    get:
      tags:
        - Search
      summary: List contacts (recommended)
      description: |
        List contacts, can query by emailAddress, phoneNumber or by contactSymphonyId or by advisorSymphonyId.
        If the advisor has the admin:list-customers permission, they will be able to retrieve all pod contacts for a given externalNetwork, or to see other advisor's list of contacts.
      operationId: listContacts2
      parameters:
        - name: externalNetwork
          in: query
          description: "The external network: WHATSAPP, SMS, WECHAT, SMS-DIRECT, LINE or WHATSAPP-DIRECT"
          required: true
          schema:
            minLength: 1
            type: string
            example: WHATSAPP
        - name: emailAddress
          in: query
          description: Contact's email address
          required: false
          schema:
            type: string
            format: email
            example: johndoe@symphony.com
        - name: phoneNumber
          in: query
          description: Contact's phone number
          required: false
          schema:
            type: string
            format: phone
            example: +33 1 23 45 67 89
        - name: symphonyId
          in: query
          description: Contact's Symphony user ID
          required: false
          schema:
            type: string
            pattern: '^\d+$'
            example: 1234567890
        - name: advisorSymphonyId
          in: query
          description: The advisor's Symphony ID
          required: false
          schema:
            type: string
            pattern: '^\d+$'
            example: 1234567890
        - name: phoneBlocked
          in: query
          description: Filter only available or blocked contact's phones
          required: false
          schema:
            type: string
            enum:
              - "all"
              - "false"
              - "true"
            default: all
        - name: before
          in: query
          description: The before cursor for pagination
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: The after cursor for pagination
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Contact found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list-contact-response"
        "404":
          description: Contact or tenant not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/contact-not-found'
                  - $ref: '#/components/schemas/tenant-not-found'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_401"
        "403":
          description: Operation forbidden
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/inline_response_403_0"
                  - $ref: '#/components/schemas/user-id-mismatch'
      security:
        - sfsAuthentication: []

