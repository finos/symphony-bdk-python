      security:
        - sfsAuthentication: []
  "/api/v1/customer/contacts/{contactSymphonyId}/copy":
    post:
      tags:
        - Contact
      summary: Copy contact
      description: |
        Create a new contact copy. <br />
        Some contacts might be shared between tenants. Shared contacts updates are not allowed. <br />
        This API allows to create a contact copy that is dedicated for the requesting tenant and that can be updated. <br />
        <br/>
        <b>Contacts that are created starting from the 23.03 release are already not shared between tenants. This API is dedicated for shared contacts created prior to the 23.03 release.</b><br/>
        <br/>
        <b>Please note:</b>
        <ul>
          <li>A new account is created for the user, with a new Symphony user ID.</li>
          <li>There is no change in the user's data.</li>
          <li>The original user account is removed from all rooms and the new account is added to these rooms. Then, a system message is pushed to each room: <i>Maintenance completed on account: {contact first name} {contact last name}. No action on your part is required.</i></li>
          <li>The email format of the user will appear differently in Content Export. <b>Old format</b>: <i>{network}.{phone}@symphony.com.</i> <b>New format</b>: <i>{network}.{phone}.{tenantId}@symphony.com</i></li>
          <li>This API is only supported for WHATSAPP and SMS contacts.</li>
          <li>Users who are still part of Symphony IMs cannot be copied. IMs should be first removed from Federation Services.</li>
          <li>The copy action is not required for users onboarded by a single tenant before the 23.03 release, or for all users onboarded after 23.03 release.</li>
        </ul>
      operationId: copyContact
      parameters:
        - name: contactSymphonyId
          in: path
          description: Contact's Symphony ID
          required: true
          schema:
            type: string
            pattern: '^\d+$'
            example: 1234567890
      responses:
        "200":
          description: Contact successfully copied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/copy-contact-response"
        "400":
          description: Missing or malformed input
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/user-copy-not-supported-for-network"
        "403":
          description: Copy user forbidden
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/forbidden-entitlement-type'
                  - $ref: '#/components/schemas/user-copy-not-supported-for-ims'
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/contact-not-found"
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/current-tenant-has-own-user-copy'
        "500":
          description: Contact update failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/copy-contact-failed"
      security:
        - sfsAuthentication: []
